<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFloat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Title Bar -->
    <div class="title-bar">
      <h1>🍅 FocusFloat</h1>
      <div class="controls">
        <button id="btn-settings-open" title="Settings">⚙️</button>
        <button id="btn-minimize" title="Minimize">—</button>
      </div>
    </div>

    <!-- Phase -->
    <div class="phase-section">
      <div class="phase-label" id="phase-label">🍅 Work</div>
      <div class="phase-sublabel" id="phase-sublabel">Deep focus time</div>
    </div>

    <!-- Circular Timer -->
    <div class="timer-circle-wrapper">
      <div class="timer-circle">
        <svg>
          <circle class="bg-ring" cx="110" cy="110" r="100"></circle>
          <circle class="progress-ring" id="progress-ring" cx="110" cy="110" r="100"></circle>
        </svg>
        <div class="timer-display" id="timer-display">25:00</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-section">
      <button class="btn btn-primary" id="btn-start">▶ Start</button>
      <button class="btn btn-secondary" id="btn-skip">⏭ Skip</button>
      <button class="btn btn-pip" id="btn-pip" title="Float Timer (⌘⇧F)">🔲 Float</button>
    </div>

    <!-- Fatigue Bar -->
    <div class="fatigue-section">
      <div class="fatigue-header">
        <span>Fatigue</span>
        <span id="fatigue-text">0 / 60</span>
      </div>
      <div class="fatigue-bar">
        <div class="fatigue-fill" id="fatigue-fill" style="width: 0%"></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-value" id="stat-work">0</span>
        <span class="stat-label">🍅 Work</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-ai">0</span>
        <span class="stat-label">🤖 AI</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-breaks">0</span>
        <span class="stat-label">😴 Resets</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-time">0h</span>
        <span class="stat-label">⏱ Total</span>
      </div>
    </div>

    <!-- Cycle Progress -->
    <div class="cycle-section">
      <div class="cycle-header">Current Cycle</div>
      <div class="cycle-dots" id="cycle-dots">
        <!-- Filled by JS -->
      </div>
    </div>
  </div>

  <!-- Settings Panel -->
  <div class="settings-panel" id="settings-panel">
    <div class="settings-header">
      <h2>⚙️ Settings</h2>
      <button class="btn btn-secondary" id="btn-settings-close">✕ Close</button>
    </div>

    <div class="settings-grid">
      <div class="setting-group">
        <h3>⏱ Durations</h3>
        <div class="setting-row">
          <label>Work Duration</label>
          <div>
            <input type="number" id="set-work" min="1" max="120" value="25">
            <span class="unit">min</span>
          </div>
        </div>
        <div class="setting-row">
          <label>AI Handling Duration</label>
          <div>
            <input type="number" id="set-ai" min="1" max="60" value="20">
            <span class="unit">min</span>
          </div>
        </div>
        <div class="setting-row">
          <label>Base Rest Duration</label>
          <div>
            <input type="number" id="set-rest" min="1" max="30" value="5">
            <span class="unit">min</span>
          </div>
        </div>
        <div class="setting-row">
          <label>Long Break Duration</label>
          <div>
            <input type="number" id="set-longbreak" min="5" max="60" value="25">
            <span class="unit">min</span>
          </div>
        </div>
      </div>

      <div class="setting-group">
        <h3>🧠 Progressive Rest</h3>
        <div class="setting-row">
          <label>Rest Increment</label>
          <div>
            <input type="number" id="set-increment" min="0" max="10" value="2">
            <span class="unit">min / cycle</span>
          </div>
        </div>
        <div class="setting-row">
          <label>Max Rest Duration</label>
          <div>
            <input type="number" id="set-maxrest" min="5" max="60" value="20">
            <span class="unit">min</span>
          </div>
        </div>
        <div class="setting-row">
          <label>Fatigue Threshold</label>
          <div>
            <input type="number" id="set-fatigue" min="20" max="200" value="60">
            <span class="unit">points</span>
          </div>
        </div>
      </div>

      <div class="setting-group">
        <h3>🔊 Preferences</h3>
        <div class="setting-row">
          <label>Sound Notifications</label>
          <label class="toggle">
            <input type="checkbox" id="set-sound" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <label>Auto-start Next Phase</label>
          <label class="toggle">
            <input type="checkbox" id="set-autostart">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <script src="../core/timer.js"></script>
  <script src="app.js"></script>
</body>
</html>
