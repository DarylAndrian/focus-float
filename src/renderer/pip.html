<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFloat PiP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="pip">
  <div id="pip-app">
    <div class="pip-phase" id="pip-phase">🍅 Work</div>
    <div class="pip-time" id="pip-time">25:00</div>
    <div class="pip-progress-bar">
      <div class="pip-progress-fill" id="pip-progress" style="width: 0%"></div>
    </div>
    <div class="pip-controls">
      <button class="pip-btn pip-btn-play" id="pip-btn-play" title="Play/Pause">▶</button>
      <button class="pip-btn pip-btn-expand" id="pip-btn-expand" title="Open Full View">↗</button>
    </div>
    <div class="pip-fatigue-mini" id="pip-fatigue">Fatigue: 0/60</div>
  </div>

  <script src="../core/timer.js"></script>
  <script src="pip.js"></script>
</body>
</html>
